name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify committed runtime loads before any build
        run: node -e "import('./dist/index.js').then(m => { if (!m.DockerWorkspaceRuntime) process.exit(1) })"
      - run: npm run check
      - name: Verify package contains runtime
        run: |
          npm pack --dry-run
          test -f dist/index.js
          test -f dist/install-preset.js

  git-install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm 11.7.0
        run: npm install -g pnpm@11.7.0
      - name: Install through the real Harness plugin command
        shell: pwsh
        run: |
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'dsh-home'
          npx --yes @deepseek-ai/dsh plugin --profile ci add "github:hibenji/dsh-docker-workspace#$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $env:DSH_HOME 'profiles/ci/node_modules/@hibenji/dsh-docker-workspace/dist/index.js'
          if (-not (Test-Path $installed)) { throw "prebuilt dist/index.js missing after Harness install: $installed" }

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Run real Docker isolation smoke test
        run: npm run test:docker
