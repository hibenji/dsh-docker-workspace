name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify committed runtime loads before any build
        run: node -e "import('./dist/docker-workspace.js').then(m => { if (!m.DockerWorkspaceRuntime) process.exit(1) })"
      - run: npm run check
      - name: Verify package contains runtime
        run: |
          npm pack --dry-run
          test -f dist/index.js
          test -f dist/install-preset.js

  git-install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm 11.7.0
        run: npm install -g pnpm@11.7.0
      - name: Reproduce Harness git-plugin installation on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path profile | Out-Null
          Set-Location profile
          '{"name":"git-install-smoke","private":true}' | Set-Content -Encoding utf8 package.json
          @'
          packages:
            - .
          autoInstallPeers: false
          '@ | Set-Content -Encoding utf8 pnpm-workspace.yaml
          pnpm add "github:hibenji/dsh-docker-workspace#$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'node_modules/@hibenji/dsh-docker-workspace/dist/index.js')) { throw 'prebuilt dist/index.js missing after git install' }

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Run real Docker isolation smoke test
        run: npm run test:docker
